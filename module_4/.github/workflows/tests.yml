- name: Install deps (module_4)
  working-directory: module_4
  run: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt

- name: Run tests with coverage (module_4)
  working-directory: module_4
  run: |
    pytest -o addopts= -m "web or buttons or analysis or integration" \
      --cov --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=100
