name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (module_5)
        working-directory: module_5
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pylint (10/10)
        working-directory: module_5
        run: |
          python -m pylint src --fail-under=10

      - name: Pytest (coverage 100%)
        working-directory: module_5
        env:
          PYTHONPATH: ${{ github.workspace }}/module_5
        run: |
          python -m pytest -q

      - name: Dependency graph (pydeps + graphviz)
        working-directory: module_5
        run: |
          pydeps src/app.py --noshow -T svg -o dependency.svg
          test -f dependency.svg

      - name: Snyk test (skip if no token)
        working-directory: module_5
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN not set; skipping snyk test."
            exit 0
          fi
          npm i -g snyk
          snyk test