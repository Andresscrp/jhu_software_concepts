python3 - <<'PY'
from pathlib import Path

Path("docker-compose.yml").write_text("""services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gradcafe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gradcafe"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  db_init:
    build:
      context: .
      dockerfile: ./src/db_init.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gradcafe
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "/app/src/load_data.py"]
    volumes:
      - ./src/llm_extend_applicant_data.json:/app/src/llm_extend_applicant_data.json:ro
      - ./src/load_data.py:/app/src/load_data.py:ro
    restart: "no"

  web:
    build:
      context: .
      dockerfile: ./src/web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gradcafe
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672/%2F
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    command: ["python", "-m", "src.web.run"]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: ./src/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gradcafe
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672/%2F
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      RABBITMQ_WAIT_SECONDS: "90"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    command: ["python", "/app/src/worker/consumer.py"]
    restart: unless-stopped

volumes:
  pgdata:
""", encoding="utf-8")
print("docker-compose.yml rewritten")
PY